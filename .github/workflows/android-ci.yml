name: Android CI

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]
  schedule:
    - cron: "17 18 * * *"
  workflow_dispatch:
    inputs:
      lane:
        description: "Compatibility lane"
        required: true
        default: main
        type: choice
        options:
          - main
          - nightly
          - staging
          - release

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.event_name == 'workflow_dispatch' && github.event.inputs.lane || github.ref }}
  cancel-in-progress: true

jobs:
  policy-and-unit:
    name: policy-and-unit
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - uses: android-actions/setup-android@v3
      - name: Install Android toolchain
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;28.2.13676358" "cmake;3.22.1"
      - name: Verify source policies
        shell: bash
        run: |
          set -euo pipefail
          # Discovered, not listed. A hand-maintained list goes stale the first
          # time somebody adds a contract and forgets, and the failure is silent
          # in the worst direction: a test that never runs looks exactly like a
          # test that passes. It also made every branch edit the same three
          # lines, so independent changes collided here and nowhere else.
          shopt -s nullglob
          contracts=(scripts/test_*.py)
          if [ ${#contracts[@]} -eq 0 ]; then
              echo "::error::No source contracts were found; the selector is broken."
              exit 1
          fi
          printf 'running %d contracts\n' "${#contracts[@]}"
          for contract in "${contracts[@]}"; do
              echo "--- $contract"
              python3 "$contract"
          done
          python3 scripts/check_log_policy.py
      - name: Unit tests and DEV debug build
        # assemblePlayDebug rides along here on purpose. A flavour nothing
        # compiles is configuration that rots, and a job of its own would cost
        # a runner on every push to prove one assemble.
        run: ./gradlew --no-daemon :app:testDevDebugUnitTest :app:assembleDevDebug :app:assemblePlayDebug

  compatibility:
    name: compatibility-api-${{ matrix.api }}-${{ matrix.variant }}
    needs: policy-and-unit
    if: github.event_name != 'workflow_dispatch' || github.event.inputs.lane != 'staging'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(github.event_name == 'pull_request' && '[{"api":25,"variant":"Dev","package":"com.am2.tik.dev"},{"api":34,"variant":"Dev","package":"com.am2.tik.dev"}]' || (github.event_name == 'schedule' || github.event.inputs.lane == 'nightly') && '[{"api":16,"variant":"Dev","package":"com.am2.tik.dev"},{"api":19,"variant":"Dev","package":"com.am2.tik.dev"},{"api":25,"variant":"Dev","package":"com.am2.tik.dev"},{"api":26,"variant":"Dev","package":"com.am2.tik.dev"},{"api":34,"variant":"Dev","package":"com.am2.tik.dev"}]' || (startsWith(github.ref, 'refs/tags/') || github.event.inputs.lane == 'release') && '[{"api":16,"variant":"Production","package":"com.am2.tik"},{"api":19,"variant":"Production","package":"com.am2.tik"},{"api":25,"variant":"Production","package":"com.am2.tik"},{"api":26,"variant":"Production","package":"com.am2.tik"},{"api":34,"variant":"Production","package":"com.am2.tik"}]' || '[{"api":16,"variant":"Dev","package":"com.am2.tik.dev"},{"api":19,"variant":"Dev","package":"com.am2.tik.dev"},{"api":25,"variant":"Dev","package":"com.am2.tik.dev"},{"api":26,"variant":"Dev","package":"com.am2.tik.dev"},{"api":34,"variant":"Dev","package":"com.am2.tik.dev"}]') }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - uses: android-actions/setup-android@v3
      - name: Install Android toolchain
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0" "ndk;28.2.13676358" "cmake;3.22.1"
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Build test APKs
        run: ./gradlew --no-daemon ":app:assemble${{ matrix.variant }}Debug" ":app:assemble${{ matrix.variant }}DebugAndroidTest"
      - name: Boot API ${{ matrix.api }} and run compatibility checks
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          arch: ${{ matrix.api < 21 && 'x86' || 'x86_64' }}
          target: default
          disable-animations: false
          emulator-boot-timeout: 900
          script: sh scripts/run_emulator_compatibility.sh "${{ matrix.package }}"

  build-staging-candidate:
    name: build-staging-candidate
    needs: policy-and-unit
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.lane == 'staging' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - uses: android-actions/setup-android@v3
      - name: Install Android toolchain
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;28.2.13676358" "cmake;3.22.1"
      # One key across every staging build, so a handset can be updated in
      # place. Without it each runner generates its own throwaway debug key and
      # the field pays an uninstall per round. The keystore arrives as base64
      # because a secret is text; it is written outside the workspace so it
      # cannot be picked up by any packaging step.
      # One key across every staging build, so a handset can be updated in
      # place. Without it each runner generates its own throwaway debug key and
      # the field pays an uninstall per round. The keystore arrives as base64
      # because a secret is text, and is written to RUNNER_TEMP rather than the
      # workspace so no packaging step can pick it up.
      - name: Restore the staging signing key
        id: staging_key
        env:
          KEYSTORE_BASE64: ${{ secrets.AM2_STAGING_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "${KEYSTORE_BASE64:-}" ]; then
            echo "::warning::no staging keystore configured; this APK cannot be installed over the previous one"
            echo "path=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          printf '%s' "${KEYSTORE_BASE64}" | base64 -d > "${RUNNER_TEMP}/staging.jks"
          echo "path=${RUNNER_TEMP}/staging.jks" >> "$GITHUB_OUTPUT"
      # Which signer a staging build will trust, read off the key that is about
      # to sign it.
      #
      # UpdateVerifier refuses an update unless BuildConfig's approved digest is
      # 64 hex characters and equals the manifest's. This job never passed one,
      # so it was the empty string its default provides and every downloaded
      # update was refused -- on every staging build there has ever been, with
      # self-update enabled on this flavour, so an operator got all the way
      # through the download first. No signing key could have fixed it: the
      # value is a build property that was never sent.
      #
      # Derived rather than configured. A repository variable holding this would
      # be a second copy of a fact the keystore already carries, and the drift
      # between them would only surface as a handset refusing an update.
      #
      # The password goes in on stdin for the same reason the four below are not
      # -P arguments: a command line is visible in the process list.
      - name: Read the signer this build will trust
        id: approved_signer
        if: steps.staging_key.outputs.path != ''
        env:
          KEYSTORE_PASSWORD: ${{ secrets.AM2_STAGING_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.AM2_STAGING_KEY_ALIAS }}
        run: |
          set -euo pipefail
          DIGEST="$(printf '%s\n' "$KEYSTORE_PASSWORD" \
            | keytool -list -v -keystore "${{ steps.staging_key.outputs.path }}" -alias "$KEY_ALIAS" \
            | sed -n 's/.*SHA256: *\([0-9A-Fa-f:]*\).*/\1/p' \
            | head -1 | tr -d ':' | tr 'A-F' 'a-f')"
          printf '%s' "$DIGEST" | grep -Eq '^[0-9a-f]{64}$' \
            || { echo "::error::could not read a SHA-256 from the staging keystore"; exit 1; }
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"
          echo "staging builds will trust $DIGEST"
      # Passed as ORG_GRADLE_PROJECT_* rather than -P: Gradle reads those as
      # project properties, and a password on the command line is visible in
      # the process list to anything else running on the machine.
      #
      # All four empty is the unconfigured case and builds normally. Some but
      # not all is a misconfiguration, and build.gradle.kts stops on it by
      # name rather than quietly signing with the runner's own debug key.
      - name: Build one staging application and test APK
        env:
          ORG_GRADLE_PROJECT_AM2_STAGING_KEYSTORE_FILE: ${{ steps.staging_key.outputs.path }}
          ORG_GRADLE_PROJECT_AM2_STAGING_KEYSTORE_PASSWORD: ${{ secrets.AM2_STAGING_KEYSTORE_PASSWORD }}
          ORG_GRADLE_PROJECT_AM2_STAGING_KEY_ALIAS: ${{ secrets.AM2_STAGING_KEY_ALIAS }}
          ORG_GRADLE_PROJECT_AM2_STAGING_KEY_PASSWORD: ${{ secrets.AM2_STAGING_KEY_PASSWORD }}
          ORG_GRADLE_PROJECT_AM2_APPROVED_SIGNER_SHA256: ${{ steps.approved_signer.outputs.digest }}
        run: ./gradlew --no-daemon -PAM2_VERSION_CODE="$GITHUB_RUN_NUMBER" :app:testStagingDebugUnitTest :app:assembleStagingDebug :app:assembleStagingDebugAndroidTest
      - name: Record immutable staging candidate identity
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t APP_APKS < <(find app/build/outputs/apk/staging/debug -maxdepth 1 -name '*.apk' -type f -print)
          mapfile -t TEST_APKS < <(find app/build/outputs/apk/androidTest/staging/debug -maxdepth 1 -name '*.apk' -type f -print)
          test "${#APP_APKS[@]}" -eq 1
          test "${#TEST_APKS[@]}" -eq 1
          APP_APK="${APP_APKS[0]}"
          TEST_APK="${TEST_APKS[0]}"
          mkdir -p staging-candidate
          cp "$APP_APK" staging-candidate/am2-client-staging-debug.apk
          cp "$TEST_APK" staging-candidate/am2-client-staging-debug-androidTest.apk
          (
            cd staging-candidate
            sha256sum am2-client-staging-debug.apk am2-client-staging-debug-androidTest.apk > SHA256SUMS
          )
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging staging-candidate/am2-client-staging-debug.apk > staging-candidate/apk-badging.txt
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs staging-candidate/am2-client-staging-debug.apk > staging-candidate/signer-metadata.txt
          stat --printf='byte_size=%s\n' staging-candidate/am2-client-staging-debug.apk > staging-candidate/build-metadata.txt
          printf 'source_commit=%s\nenvironment=staging\nvariant=StagingDebug\nsupported_api=16+\n' "$GITHUB_SHA" >> staging-candidate/build-metadata.txt
          # keytool read the key; apksigner reads the artifact. If they disagree
          # the build trusts a signer other than its own, and every update it is
          # offered will be refused -- silently, on a handset, weeks later.
          EXPECTED="${{ steps.approved_signer.outputs.digest }}"
          if [ -n "$EXPECTED" ]; then
            SIGNED_BY=$(sed -n 's/.*certificate SHA-256 digest: *\([0-9a-fA-F]\{64\}\).*/\1/p' \
              staging-candidate/signer-metadata.txt | head -1 | tr 'A-F' 'a-f')
            test "$EXPECTED" = "$SIGNED_BY" \
              || { echo "::error::build trusts $EXPECTED but was signed by $SIGNED_BY"; exit 1; }
            printf 'approved_signer=%s\n' "$EXPECTED" >> staging-candidate/build-metadata.txt
          fi
      - name: Publish the manifest the device parses
        shell: bash
        env:
          UPDATE_URL: https://staging-apiapi.am2-poc.com/update/update.apk
        run: |
          set -euo pipefail
          # The manifest deployment used to publish carried `download_url` and no
          # digests, while the device requires `update_url`, `sha256` and
          # `signer_sha256` and throws on the first missing key. So the update
          # check failed outright rather than reporting "no update", and the
          # channel had never delivered anything to anyone.
          #
          # It is written here because this is the only place that holds the APK
          # and its signature at the same time. Every field is read back off the
          # artifact rather than restated, so a manifest cannot describe a build
          # other than the one beside it.
          #
          # changelog is the exception, and comes from app/release-notes.json:
          # it is the one string here written for a person to read, and the
          # panel renders it in whichever language that person chose. It used to
          # be "staging build from <sha>", which is not a release note in any
          # language -- and the version name says that better now anyway, since
          # 1.1.0-staging+124 identifies the build on its own.
          APK=staging-candidate/am2-client-staging-debug.apk
          BADGING=staging-candidate/apk-badging.txt
          VERSION_CODE=$(sed -n "s/.*versionCode='\([0-9]\+\)'.*/\1/p" "$BADGING" | head -1)
          VERSION_NAME=$(sed -n "s/.*versionName='\([^']*\)'.*/\1/p" "$BADGING" | head -1)
          APK_SHA=$(sha256sum "$APK" | cut -d' ' -f1)
          SIGNER_SHA=$(sed -n 's/.*certificate SHA-256 digest: *\([0-9a-fA-F]\{64\}\).*/\1/p' \
              staging-candidate/signer-metadata.txt | head -1 | tr 'A-F' 'a-f')

          test -n "$VERSION_CODE" || { echo "::error::no versionCode in badging"; exit 1; }
          test -n "$VERSION_NAME" || { echo "::error::no versionName in badging"; exit 1; }
          [ "$VERSION_CODE" -gt 3 ] || { echo "::error::versionCode $VERSION_CODE cannot supersede a field unit"; exit 1; }
          printf '%s' "$SIGNER_SHA" | grep -Eq '^[0-9a-f]{64}$' \
              || { echo "::error::could not read the signer digest"; exit 1; }

          jq -n \
            --argjson version_code "$VERSION_CODE" \
            --arg version_name "$VERSION_NAME" \
            --arg update_url "$UPDATE_URL" \
            --arg sha256 "$APK_SHA" \
            --arg signer_sha256 "$SIGNER_SHA" \
            --argjson changelog "$(cat app/release-notes.json)" \
            '{version_code: $version_code, version_name: $version_name, update_url: $update_url,
              sha256: $sha256, signer_sha256: $signer_sha256, changelog: $changelog}' \
            > staging-candidate/version.json

          echo "--- published manifest"
          cat staging-candidate/version.json
      - name: Upload immutable staging handoff
        uses: actions/upload-artifact@v4
        with:
          name: am2-client-staging-handoff-${{ github.sha }}-${{ github.run_attempt }}
          path: staging-candidate/
          if-no-files-found: error
          retention-days: 1

  staging-compatibility:
    name: staging-api-${{ matrix.api }}-same-apk
    needs: build-staging-candidate
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.lane == 'staging' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        api: [16, 19, 25, 26, 34]
        package: [com.am2.tik.staging]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: am2-client-staging-handoff-${{ github.sha }}-${{ github.run_attempt }}
          path: staging-candidate
      - name: Require exact staging handoff contents
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t HANDOFF_FILES < <(find staging-candidate -maxdepth 1 -type f -printf '%f\n' | sort)
          EXPECTED_FILES=(
            SHA256SUMS
            am2-client-staging-debug-androidTest.apk
            am2-client-staging-debug.apk
            apk-badging.txt
            build-metadata.txt
            signer-metadata.txt
            version.json
          )
          test "${#HANDOFF_FILES[@]}" -eq "${#EXPECTED_FILES[@]}"
          diff -u <(printf '%s\n' "${EXPECTED_FILES[@]}") <(printf '%s\n' "${HANDOFF_FILES[@]}")
      - name: Verify candidate digest before installation
        run: (cd staging-candidate && sha256sum -c SHA256SUMS)
      - name: Require the manifest to describe the APK beside it
        shell: bash
        run: |
          set -euo pipefail
          # A manifest that names a different build is worse than none: the
          # device downloads, fails the digest check, deletes the file and
          # reports nothing. Bind them here, where both are present.
          cd staging-candidate
          MANIFEST_SHA=$(jq -r '.sha256' version.json)
          ACTUAL_SHA=$(sha256sum am2-client-staging-debug.apk | cut -d' ' -f1)
          test "$MANIFEST_SHA" = "$ACTUAL_SHA" \
            || { echo "::error::manifest describes $MANIFEST_SHA, artifact is $ACTUAL_SHA"; exit 1; }
          MANIFEST_CODE=$(jq -r '.version_code' version.json)
          BADGED_CODE=$(sed -n "s/.*versionCode='\([0-9]\+\)'.*/\1/p" apk-badging.txt | head -1)
          test "$MANIFEST_CODE" = "$BADGED_CODE" \
            || { echo "::error::manifest says $MANIFEST_CODE, APK says $BADGED_CODE"; exit 1; }
      - uses: android-actions/setup-android@v3
      - name: Install Android platform tools
        run: sdkmanager "platform-tools"
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Boot API ${{ matrix.api }} and test the exact staging APK
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          arch: ${{ matrix.api < 21 && 'x86' || 'x86_64' }}
          target: default
          disable-animations: false
          emulator-boot-timeout: 900
          script: sh scripts/run_emulator_compatibility.sh "${{ matrix.package }}" staging-candidate/am2-client-staging-debug.apk staging-candidate/am2-client-staging-debug-androidTest.apk

  staging-artifact:
    name: staging-artifact
    needs: staging-compatibility
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.lane == 'staging' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: am2-client-staging-handoff-${{ github.sha }}-${{ github.run_attempt }}
          path: staging-candidate
      - name: Verify and package the proven APK without rebuilding
        shell: bash
        run: |
          set -euo pipefail
          (cd staging-candidate && sha256sum -c SHA256SUMS)
          mkdir -p staging-artifact
          cp staging-candidate/am2-client-staging-debug.apk staging-artifact/
          cp staging-candidate/apk-badging.txt staging-artifact/
          cp staging-candidate/signer-metadata.txt staging-artifact/
          cp staging-candidate/build-metadata.txt staging-artifact/
          (
            cd staging-artifact
            sha256sum am2-client-staging-debug.apk > SHA256SUMS
          )
          printf 'validated_api=16,19,25,26,34\n' >> staging-artifact/build-metadata.txt
      - name: Upload proven staging candidate
        uses: actions/upload-artifact@v4
        with:
          name: am2-client-staging-debug-${{ github.sha }}
          path: staging-artifact/
          if-no-files-found: error
          retention-days: 3

  release-artifact:
    name: release-artifact
    needs: compatibility
    # The ref check lives here rather than in a deployment branch policy on the
    # `android-release` environment. That policy allowed main and v* and was the
    # only thing stopping a dispatched release from an arbitrary branch -- the
    # condition below used to accept any ref for lane=release. GitHub ignores
    # environment protection rules outright on a private repository under Free,
    # so the policy would have gone quiet without failing anything, leaving a
    # line that looked like a guard. Conditions are read from the workflow file
    # at the commit being run, and that does not depend on the plan.
    if: >-
      startsWith(github.ref, 'refs/tags/v')
      || (github.event_name == 'workflow_dispatch'
          && github.event.inputs.lane == 'release'
          && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - uses: android-actions/setup-android@v3
      - name: Install Android toolchain
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;28.2.13676358" "cmake;3.22.1"
      # The upload key. It used to be kept out of CI deliberately, and the lane
      # produced an unsigned artifact somebody signed by hand. That is reversed:
      # the key lives in repository secrets, the lane signs what it builds, and
      # the operator uploads rather than re-signs.
      #
      # Written to RUNNER_TEMP, never the workspace -- the artifact upload step
      # below globs a directory, and a key inside it would be published.
      - name: Restore the upload key
        env:
          KEYSTORE_BASE64: ${{ secrets.AM2_UPLOAD_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "${KEYSTORE_BASE64:-}" ]; then
            echo "AM2_UPLOAD_KEYSTORE_BASE64 is not set; a release cannot be signed" >&2
            exit 1
          fi
          printf '%s' "${KEYSTORE_BASE64}" | base64 -d > "${RUNNER_TEMP}/upload.jks"
      # Signing material through ORG_GRADLE_PROJECT_*, which Gradle reads as
      # project properties. Passing it with -P would put the passwords in the
      # process list.
      - name: Full unit tests, signed production APK and Play bundle
        env:
          AM2_APPROVED_SIGNER_SHA256: ${{ vars.AM2_APPROVED_SIGNER_SHA256 }}
          ORG_GRADLE_PROJECT_AM2_KEYSTORE_FILE: ${{ runner.temp }}/upload.jks
          ORG_GRADLE_PROJECT_AM2_KEYSTORE_PASSWORD: ${{ secrets.AM2_UPLOAD_KEYSTORE_PASSWORD }}
          ORG_GRADLE_PROJECT_AM2_KEY_ALIAS: ${{ secrets.AM2_UPLOAD_KEY_ALIAS }}
          ORG_GRADLE_PROJECT_AM2_KEY_PASSWORD: ${{ secrets.AM2_UPLOAD_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test "$(printf '%s' "$AM2_APPROVED_SIGNER_SHA256" | tr -d ':' | tr '[:upper:]' '[:lower:]' | grep -Ec '^[0-9a-f]{64}$')" -eq 1
          # Two outputs from one build: the APK the field sideloads, and the
          # App Bundle Play has required for new apps since 2021. The bundle
          # was named in the design and never actually produced by anything.
          ./gradlew --no-daemon :app:test \
            :app:assembleProductionRelease :app:bundlePlayRelease \
            -PAM2_APPROVED_SIGNER_SHA256="$AM2_APPROVED_SIGNER_SHA256" \
            -PAM2_VERSION_CODE="$GITHUB_RUN_NUMBER"
      - name: Record artifact identity
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find app/build/outputs/apk/production/release -name '*.apk' -type f -print -quit)"
          test -n "$APK"
          AAB="$(find app/build/outputs/bundle/playRelease -name '*.aab' -type f -print -quit)"
          test -n "$AAB"
          mkdir -p release-artifact
          cp "$APK" release-artifact/am2-client-production.apk
          cp "$AAB" release-artifact/am2-client-play.aab
          sha256sum release-artifact/am2-client-production.apk release-artifact/am2-client-play.aab \
            > release-artifact/SHA256SUMS
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging release-artifact/am2-client-production.apk > release-artifact/apk-badging.txt
          stat --printf='apk_byte_size=%s\n' release-artifact/am2-client-production.apk > release-artifact/build-metadata.txt
          stat --printf='aab_byte_size=%s\n' release-artifact/am2-client-play.aab >> release-artifact/build-metadata.txt
          # Signed is now the expected state, so a verification failure has to
          # stop the lane. It used to be recorded as signed=false and shipped,
          # which was correct when unsigned was intended and is not any more.
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs \
            release-artifact/am2-client-production.apk > release-artifact/signer-metadata.txt 2>&1
          printf 'signed=true\n' >> release-artifact/signer-metadata.txt
          printf 'source_commit=%s\nenvironment=production\n' "$GITHUB_SHA" >> release-artifact/build-metadata.txt
      - name: Upload release candidate only
        uses: actions/upload-artifact@v4
        with:
          name: am2-client-release-${{ github.sha }}
          path: release-artifact/
          if-no-files-found: error
          retention-days: 3
