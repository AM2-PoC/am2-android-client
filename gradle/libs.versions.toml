[versions]
agp = "9.0.0"
kotlin = "2.2.10"
# Core KTX 1.12.0 adalah versi terakhir yang mendukung API 19 secara stabil,
# untuk API 16 gunakan 1.9.0
coreKtx = "1.9.0"
junit = "4.13.2"
# AndroidX Test 1.4.x is the coherent runner stack for API 16/19.
junitVersion = "1.1.3"
espressoCore = "3.4.0"
# AppCompat 1.6.1 adalah versi terakhir yang mendukung API 19.
# Untuk dukungan API 16, gunakan 1.4.2
appcompat = "1.4.2"
# Material 1.9.0 adalah versi terakhir yang mendukung API 19.
# Untuk API 16, gunakan 1.8.0
material = "1.8.0"
osmdroid = "6.1.18"

[libraries]
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
junit = { group = "junit", name = "junit", version.ref = "junit" }
androidx-junit = { group = "androidx.test.ext", name = "junit", version.ref = "junitVersion" }
androidx-espresso-core = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "espressoCore" }
androidx-appcompat = { group = "androidx.appcompat", name = "appcompat", version.ref = "appcompat" }
material = { group = "com.google.android.material", name = "material", version.ref = "material" }
osmdroid-android = { group = "org.osmdroid", name = "osmdroid-android", version.ref = "osmdroid" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
