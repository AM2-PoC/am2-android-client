# The field app's release, in one place.
#
# versionName was "1.1.${versionCode}", so build 124 called itself 1.1.124.
# That identifies the build and does it by claiming a hundred and twenty-four
# backward compatible bug fixes, because that is what Semantic Versioning says
# the PATCH component means. The build now goes where semver puts it -- after a
# '+', as metadata, ignored when comparing versions -- and this file holds the
# release a human actually decided on.
#
# CI reads it too: the update manifest names a version, and a quoted literal in
# a build script is not something another job can read.
#
# The flavour appends its own tag: -dev, -staging, nothing for production, and
# nothing at all for play, which has a store listing to keep tidy.
#
# 1.2.0, not 1.1.0. Rule 7 of Semantic Versioning: "Minor version Y MUST be
# incremented if new, backward compatible functionality is introduced." Device
# tokens, the idle limit on them, sessions that are always kept, and the auth=
# field on the login record are all exactly that, and every one of them landed
# after 1.1.0 was written down. The number is a decision, and nobody had made
# one since this file was created.
versionName=1.2.0
